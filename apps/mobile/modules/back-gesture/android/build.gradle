plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.backgesture'
version = '0.1.0'

android {
  namespace "expo.modules.backgesture"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation 'androidx.appcompat:appcompat:1.7.1'
  compileOnly 'com.facebook.react:react-android'
}
