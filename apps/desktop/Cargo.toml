[package]
name = "garmin-companion-desktop"
version = "0.1.0"
description = "Garmin Companion desktop app on gpui-ce"
license = "MIT"
edition = "2021"

[[bin]]
name = "garmin-companion"
path = "src/main.rs"

[dependencies]
garmin-api = { path = "../../crates/garmin-api" }
garmin-coach = { path = "../../crates/garmin-coach" }
garmin-core = { workspace = true }

anyhow = { workspace = true }
async-channel = "2"
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }

# The self-updater (updater.rs): the Tauri latest.json format, a minisign
# check before any install, and the unpack of a macOS or AppImage bundle.
base64 = { workspace = true }
flate2 = "1"
minisign-verify = "0.2"
semver = "1"
tar = "0.4"

# The temp folders of a coach turn (cli_agent.rs): a random name, mode 0700.
# Already in the tree.
tempfile = "3"

# The VS Code themes (openvsx.rs): a .vsix is a zip. Deflate only. Already in the tree.
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }

# The same pin as mbrd-rs. gpui-ce follows Zed's tree and cuts releases.
# `gpui` is the core only. The backends live in `gpui_platform`, and the three
# features below choose them: fontconfig for Linux fonts, and both display
# servers, so one binary runs on Wayland or X11. The features do nothing on
# macOS and Windows.
gpui = { package = "gpui-ce", version = "0.2.2" }
gpui_platform = { package = "gpui_ce_platform", version = "0.1", features = [
    "font-kit",
    "wayland",
    "x11",
] }

[dev-dependencies]
# Tests must not reach real user state. See garmin-core `paths.rs`.
garmin-core = { workspace = true, features = ["test-sandbox"] }
# Headless windows, to send wheel events through a real layout in a test.
gpui = { package = "gpui-ce", version = "0.2.2", features = ["test-support"] }

# The kill of a process group (cli_agent.rs). Already in the tree.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The admin-rights start of the NSIS setup (updater.rs). Already in the tree.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
