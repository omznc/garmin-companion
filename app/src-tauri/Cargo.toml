[package]
name = "app"
version = "0.1.0"
description = "Garmin Coach desktop app"
authors = ["Omar Žunić"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
garmin-core = { workspace = true }

tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

anyhow = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
futures-util = { version = "0.3.33", default-features = false, features = ["std"] }

# Desktop only: the updater swaps out the whole app bundle, which is not
# something a store-installed mobile build is allowed to do.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]
# `test` provides the mock runtime the chat integration test drives `run_turn`
# through — it needs a real AppHandle to emit its stream events into.
tauri = { version = "2", features = ["test"] }
