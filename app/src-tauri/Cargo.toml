[package]
name = "app"
version = "0.1.0"
# The bundlers fall back to these when the equivalent isn't set in
# tauri.conf.json — `description` becomes the deb/rpm Summary and `authors` the
# Maintainer, so a stale value here ships in the package metadata.
description = "Your Garmin data, read by a coach that remembers."
authors = ["Omar Žunić"]
homepage = "https://github.com/omznc/garmin-companion"
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
garmin-core = { workspace = true }

tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# The frontend picks its window chrome from the target OS, and it has to know
# which one before the first paint. This plugin's `platform()` is a compile-time
# constant handed to the webview at startup rather than an IPC round-trip, so
# the chrome never renders once and then flips sides.
tauri-plugin-os = "2"
# The coach's daily nudge. Cross-platform including Android, which is the one
# that matters — a notification you get on the phone is the difference between
# the coach speaking first and it waiting for you to open a desktop app.
tauri-plugin-notification = "2"

anyhow = { workspace = true }
chrono = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Checks a downloaded APK against the hash in `latest-android.json` before it
# goes anywhere near the system installer — see `download_apk`.
sha2 = { workspace = true }
tokio = { workspace = true }
futures-util = { version = "0.3.33", default-features = false, features = ["std"] }

# Desktop only, because the last step differs: this plugin swaps the app bundle
# on disk and restarts, and Android has no equivalent — replacing a package is
# the system's job, asked for through `PackageInstaller` and confirmed by the
# user. Android is still self-updating; it just gets there through
# `download_apk` and the `ApkInstaller` bridge instead. `process` goes with the
# plugin because the restart it offers only exists on the platforms that need
# one.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# The notification plugin hands `Schedule::At` a `time::OffsetDateTime`, and
# everything else in this workspace keeps time in chrono. Mobile only: desktop
# notifications cannot be scheduled at all, so nothing there ever builds one.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
time = "0.3"

# An undecorated macOS window is drawn borderless, which loses the system's
# rounded corner mask — the app would sit on screen as a hard rectangle. Getting
# the corners back means clipping them ourselves, which needs the window surface
# behind them to be transparent, which on macOS needs this feature.
#
# The cost is that it rules out Mac App Store distribution. `release.yml` ships
# signed artifacts through GitHub releases, so nothing here depends on that
# channel — but a future move to the store would have to give up either the
# custom chrome or the rounded corners.
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["macos-private-api"] }

[dev-dependencies]
# `test` provides the mock runtime the chat integration test drives `run_turn`
# through — it needs a real AppHandle to emit its stream events into.
tauri = { version = "2", features = ["test"] }
