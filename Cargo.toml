[workspace]
resolver = "2"
members = [
    "crates/garmin-core",
    "crates/garmin-api",
    "crates/garmin-coach",
    "crates/garmin-mcp",
    "crates/garmin-ffi",
    "apps/desktop",
    "apps/login",
]

# Cargo only honours `[profile.*]` at the workspace root, so this is the only
# place these can live — a member crate's own `[profile.*]` would be ignored silently.
# Settings favour a small binary. They apply to the MCP server binary too.
[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
# "s" over "3": the crates spend their time waiting on Garmin's API, not in
# Rust, so bytes are worth more here than throughput.
opt-level = "s"
# garmin-ffi (uniffi) needs unwinding, so it must build with `release-mobile`.
panic = "abort"
strip = true

# The mobile bridge needs unwinding. A panic in a Rust task must not stop the
# app process. "ubrn" builds with this profile (see apps/mobile/scripts).
[profile.release-mobile]
inherits = "release"
panic = "unwind"

# The desktop app does work on every frame: layout (taffy), text (cosmic-text,
# swash), path tessellation (lyon) and the GPU backend (wgpu, naga). Those
# crates and the app itself get opt-level 3. The size-first default stays for
# everything else, because `[profile.release.package."*"]` would also speed up
# the MCP server and the sign-in helper, where bytes matter more. None of the
# crates below are in those two builds.
[profile.release.package.garmin-companion-desktop]
opt-level = 3
[profile.release.package."gpui-ce"]
opt-level = 3
[profile.release.package.gpui_ce_linux]
opt-level = 3
[profile.release.package.gpui_ce_wgpu]
opt-level = 3
[profile.release.package.gpui_ce_sum_tree]
opt-level = 3
[profile.release.package.taffy]
opt-level = 3
[profile.release.package."cosmic-text"]
opt-level = 3
[profile.release.package.swash]
opt-level = 3
[profile.release.package.skrifa]
opt-level = 3
[profile.release.package."read-fonts"]
opt-level = 3
[profile.release.package."ttf-parser"]
opt-level = 3
[profile.release.package.zeno]
opt-level = 3
[profile.release.package.etagere]
opt-level = 3
[profile.release.package.wgpu]
opt-level = 3
[profile.release.package."wgpu-core"]
opt-level = 3
[profile.release.package."wgpu-hal"]
opt-level = 3
[profile.release.package.naga]
opt-level = 3
[profile.release.package.lyon_path]
opt-level = 3
[profile.release.package.lyon_geom]
opt-level = 3
[profile.release.package.lyon_algorithms]
opt-level = 3
[profile.release.package.lyon_tessellation]
opt-level = 3
[profile.release.package.resvg]
opt-level = 3
[profile.release.package.usvg]
opt-level = 3
[profile.release.package."tiny-skia"]
opt-level = 3

# Shared across the desktop app, the mobile bridge and the MCP server so they
# can never drift onto different versions of the Garmin client's dependencies.
[workspace.dependencies]
garmin-core = { path = "crates/garmin-core" }

anyhow = "1.0.104"
base64 = "0.23.1"
# `serde` is on for the notification plan, which holds a local wall-clock time
# and would otherwise have to travel as a string and be reparsed on the way back.
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "6.0.0"
keyring = "4.1.6"

# Android only — see `garmin-core::secrets` for what this does and does not buy
# on a platform with no keyring to fall back on.
aes-gcm = "0.11.0"
getrandom = "0.3.3"
openssl = { version = "0.10.68", features = ["vendored"] }
rusqlite = { version = "0.40.1", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.19"
# `sync` and `time` are for the chat turn: a question the model puts to the
# athlete parks the turn on a oneshot channel until they answer, under a timeout
# so a window closed mid-question can't leave the turn waiting forever.
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }

# native-tls (OpenSSL on Linux, Schannel on Windows, Security.framework on
# macOS) is deliberate: it matches the TLS stack verified to get past Garmin's
# Cloudflare edge. rustls presents a different ClientHello and is untested here.
reqwest = { version = "0.13.4", default-features = false, features = [
    "json", "cookies", "native-tls", "gzip", "brotli", "deflate", "zstd",
    "stream", "form", "query", "http2", "charset", "system-proxy",
] }
