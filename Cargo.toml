[workspace]
resolver = "2"
members = ["crates/garmin-core", "crates/garmin-mcp", "app/src-tauri"]

# Cargo only honours `[profile.*]` at the workspace root, so this is the only
# place these can live — `app/src-tauri/Cargo.toml` would be ignored silently.
# Settings are the ones Tauri recommends for shipping size, and they apply to
# the MCP server binary too.
[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
# "s" over "3": the app spends its time waiting on Garmin's API and the webview,
# not in Rust, so bytes are worth more here than throughput.
opt-level = "s"
# Safe because nothing in the workspace unwinds deliberately — no `catch_unwind`,
# no `#[should_panic]` tests. Tests build under the dev profile regardless.
panic = "abort"
strip = true

# Shared across the Tauri app and the MCP server so the two can never drift
# onto different versions of the Garmin client's dependencies.
[workspace.dependencies]
garmin-core = { path = "crates/garmin-core" }

anyhow = "1.0.104"
base64 = "0.23.1"
# `serde` is on for the notification plan, which crosses into the frontend as a
# local wall-clock time and would otherwise have to travel as a string and be
# reparsed on the way back.
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "6.0.0"
keyring = "4.1.6"

# Android only — see `garmin-core::secrets` for what this does and does not buy
# on a platform with no keyring to fall back on.
aes-gcm = "0.11.0"
getrandom = "0.3.3"
openssl = { version = "0.10.68", features = ["vendored"] }
rusqlite = { version = "0.40.1", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }

# native-tls (OpenSSL on Linux, Schannel on Windows, Security.framework on
# macOS) is deliberate: it matches the TLS stack verified to get past Garmin's
# Cloudflare edge. rustls presents a different ClientHello and is untested here.
reqwest = { version = "0.13.4", default-features = false, features = [
    "json", "cookies", "native-tls", "gzip", "brotli", "deflate", "zstd",
    "stream", "form", "query", "http2", "charset", "system-proxy",
] }
