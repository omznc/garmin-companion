# Builds installers for every desktop platform and attaches them to a GitHub
# release, along with the `latest.json` the in-app updater reads.
#
# Triggered by pushing a tag: `git tag v0.2.0 && git push origin v0.2.0`.
# The tag has to match the version in app/src-tauri/tauri.conf.json — the
# updater compares against that, not against the tag.
name: Release

on:
  push:
    tags: ["v*"]
  # Useful for proving the matrix still builds without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The release body, built once and handed to both of the jobs that could be
  # the one to open the draft. Its own job rather than a step in each, because
  # five jobs generating it independently is five chances for them to disagree
  # about what the release says — and because whichever wins the race writes the
  # copy that sticks.
  #
  # It is not only a release page. `tauri-action` copies this into `latest.json`
  # as `notes`, which is what the app renders in Settings once an update is
  # staged, so this text is also the answer to "what did I just install?".
  notes:
    runs-on: ubuntu-24.04
    outputs:
      body: ${{ steps.body.outputs.body }}
    steps:
      - uses: actions/checkout@v7
        with:
          # `scripts/changelog.mjs` walks back to the previous tag to find its
          # range, and the default shallow clone has neither the tag nor the
          # commits between.
          fetch-depth: 0

      - id: body
        env:
          # Through the environment rather than interpolated into the script.
          # A ref name is not attacker-controlled here, but a `run:` block that
          # pastes one in is the shape of the problem, and the habit is cheaper
          # to keep than to remember when it starts mattering.
          REF: ${{ github.ref_name }}
        run: |
          # Changes first, install instructions after: whoever is reading this
          # in the app has already installed, and whoever is reading it on the
          # download page can scroll.
          {
            echo 'body<<GARMIN_COMPANION_NOTES_EOF'
            node scripts/changelog.mjs "$REF"
            echo
            echo '---'
            echo
            cat .github/install-notes.md
            echo 'GARMIN_COMPANION_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

  build:
    needs: notes
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon and Intel are separate bundles; a universal binary
          # would double every download for the sake of one artifact.
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          # Pinned deliberately: the AppImage links against whatever glibc the
          # runner has, so building on the newest Ubuntu would refuse to start
          # on anything older.
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            file \
            wget

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ matrix.target }}

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts. Without these the build still produces
          # installers, but `latest.json` gets no signature and every client
          # rejects the update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          # Only set on a tag push. `github.ref_name` on a manual run is the
          # branch, so passing it unconditionally would make the "prove the
          # matrix builds" button cut a draft release tagged `master`. Empty
          # means tauri-action builds and publishes nothing, which is the point.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Garmin Companion ${{ github.ref_name }}
          # Written by the `notes` job — the generated changelog followed by
          # `.github/install-notes.md`. Also becomes `notes` in `latest.json`.
          releaseBody: ${{ needs.notes.outputs.body }}
          # Left as a draft so the release can be checked, and so the four
          # matrix jobs can finish filling it in before anyone downloads.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      # A manual run publishes nothing, so the bundles would die with the
      # runner. Downloading them from here is how you check the app actually
      # starts on a platform you don't own, before committing to a tag.
      - name: Upload bundles for inspection
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error

  # Its own job rather than a row in the matrix above. `tauri-action` builds
  # desktop bundles and writes the `latest.json` the updater reads; an Android
  # build produces neither, and adding it there would have the action either
  # fail or publish a `latest.json` an APK can't be an update for. Android is
  # not self-updating (see `Cargo.toml`) — a new version is a new APK.
  android:
    needs: notes
    runs-on: ubuntu-24.04
    # Job level, not step level: `secrets` isn't readable from an `if:`, and
    # step-level `env` isn't in scope for that step's own `if:` either. Lifting
    # it here is what lets the signing steps below ask whether they have a key.
    env:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
    steps:
      - uses: actions/checkout@v7

      # Gradle rejects anything newer, and the runner's default has moved past
      # it before now.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install the NDK
        run: |
          sdkmanager --install "ndk;28.2.13676358"
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"

          # The vendored OpenSSL finishes with `make install_dev`, which calls
          # RANLIB. The `cc` crate resolves that to `<triple>-ranlib`, and the
          # NDK dropped the per-target binutils wrappers at r23 — `llvm-ranlib`
          # is all that's left. The failure is late and says nothing useful:
          # every object compiles, libcrypto.a is archived and installed, then
          # `aarch64-linux-android-ranlib: not found`. AR needs no such help,
          # which is why the archive step gets that far.
          LLVM_BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for target in aarch64_linux_android armv7_linux_androideabi; do
            echo "RANLIB_$target=$LLVM_BIN/llvm-ranlib" >> "$GITHUB_ENV"
          done

      # OpenSSL is built from source for every Android ABI (see the `openssl`
      # dependency in `crates/garmin-core/Cargo.toml`), and its ./Configure is a
      # Perl program. The runner has these already; installing them explicitly
      # so a change to the base image surfaces here rather than as an
      # openssl-sys build failure four minutes in.
      - name: Install OpenSSL's build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y perl make

      # Two ABIs, not four. Every ABI is a full compile of the workspace with
      # OpenSSL built from C source on the end of it — a little under three
      # minutes each, and the vendored OpenSSL is most of that. `i686` and
      # `x86_64` are emulator ABIs: no phone has ever run either, so they cost
      # five minutes a release to produce something nobody installs. `armv7`
      # stays for 32-bit devices, which do still exist.
      #
      # Anything here has to match the `-t` list on both build steps below and
      # the one in the `android` job in ci.yml, which is what warms this cache.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      # The key has to agree with ci.yml's `android` job down to the job id:
      # rust-cache composes `v0-rust-{key}-{job}-{os}-{arch}-…`, and a run on a
      # tag can only ever *read* a cache written on the default branch. Written
      # here too, but nothing will ever restore that copy — see RELEASING.md.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: android

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      # The APK is signed with a key that has to stay the same for the life of
      # the app: Android identifies an upgrade by signature, so a rebuilt
      # keystore means every existing install has to be uninstalled by hand
      # before it can take an update. Keep the base64 of it somewhere you won't
      # lose it — see RELEASING.md.
      #
      # Missing secrets are not an error here. The build still runs and still
      # proves the Android target compiles; it just produces an unsigned APK
      # that the publish step below skips.
      - name: Write the signing key
        if: env.ANDROID_KEYSTORE != ''
        run: |
          cd app/src-tauri/gen/android
          echo "$ANDROID_KEYSTORE" | base64 --decode > release.jks
          cat > keystore.properties <<EOF
          storeFile=$(pwd)/release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      # The APK, which is the one people install and the one that self-updates.
      #
      # Copied out in the same step it's built in, and before the bundle build
      # below runs over the same output tree with a different manifest. Nothing
      # observed suggests Gradle would touch the APK there, but the failure if
      # it ever did is a released APK missing the permission it needs to update
      # itself — which nobody would notice until the release after next.
      #
      # `latest-android.json` is written here too, and is to the APK what
      # `latest.json` is to the desktop bundles: the file an installed copy
      # fetches to find out a newer one exists. Written by hand rather than by
      # `tauri-action`, which doesn't know Android is a platform. The shape is
      # documented in `app/src/lib/apk.ts`, which reads it.
      #
      # The hash is not the security boundary — Android refuses to install any
      # APK not signed with the same key as the copy it's replacing, whatever
      # is written here. It's what stops a truncated download reaching the
      # system installer as a mystery.
      - name: Build the APK
        run: |
          (cd app && pnpm tauri android build --apk -t aarch64 armv7)

          VERSION=$(node -p "require('$GITHUB_WORKSPACE/app/src-tauri/tauri.conf.json').version")
          OUT=app/src-tauri/gen/android/app/build/outputs
          mkdir -p android-out
          # Renamed on the way out. Gradle calls its output `app-universal-release`
          # whatever the app is, which on a release page next to four desktop
          # installers says nothing about what it is or which version.
          APK="android-out/garmin-companion_${VERSION}.apk"
          cp "$OUT"/apk/universal/release/*.apk "$APK"

          # A `releases/latest/download/` URL, the same form the app asks for
          # this manifest at, so both follow whatever is currently published
          # instead of pinning this tag.
          cat > android-out/latest-android.json <<EOF
          {
            "version": "${VERSION}",
            "url": "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/garmin-companion_${VERSION}.apk",
            "sha256": "$(sha256sum "$APK" | cut -d' ' -f1)"
          }
          EOF

      # The bundle, which exists for Play and has to be a slightly different
      # app: `REQUEST_INSTALL_PACKAGES` is restricted there, so the manifest
      # transform in `app/build.gradle.kts` takes it back out. A second Gradle
      # run rather than a second variant — see the comment there for why the
      # obvious answer costs four extra Rust compiles.
      #
      # `ORG_GRADLE_PROJECT_` is how a project property is set from the
      # environment, and it is the only channel there is: `tauri android build`
      # has no way to pass one through to Gradle.
      - name: Build the Play bundle
        env:
          ORG_GRADLE_PROJECT_playBundle: "true"
        run: |
          (cd app && pnpm tauri android build --aab -t aarch64 armv7)

          VERSION=$(node -p "require('$GITHUB_WORKSPACE/app/src-tauri/tauri.conf.json').version")
          OUT=app/src-tauri/gen/android/app/build/outputs
          cp "$OUT"/bundle/universalRelease/*.aab \
             "android-out/garmin-companion_${VERSION}.aab"
          ls -la android-out

      # Attached to the same draft release the desktop matrix is filling in.
      # `gh release upload` rather than a second `tauri-action`, which would
      # want to manage the release itself and rewrite `latest.json`.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/') && env.ANDROID_KEYSTORE != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Through the environment rather than interpolated into the script:
          # the body is Markdown full of backticks and dollar signs, and the
          # shell would read a good deal of it as instructions.
          RELEASE_BODY: ${{ needs.notes.outputs.body }}
        run: |
          # The desktop jobs may not have created the draft yet, and whichever
          # gets here first has to make it — with the same body, or a release
          # that Android happened to win the race for would be published empty.
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            printf '%s\n' "$RELEASE_BODY" > release-notes.md
            gh release create "${{ github.ref_name }}" --draft \
              --title "Garmin Companion ${{ github.ref_name }}" \
              --notes-file release-notes.md
          fi
          gh release upload "${{ github.ref_name }}" android-out/* --clobber

      - name: Upload for inspection
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: bundle-android
          path: android-out/
          if-no-files-found: error
