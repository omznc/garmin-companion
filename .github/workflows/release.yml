# Builds installers for every desktop platform and attaches them to a GitHub
# release, along with the `latest.json` the in-app updater reads.
#
# Triggered by pushing a tag: `git tag v0.2.0 && git push origin v0.2.0`.
# The tag has to match the version in app/src-tauri/tauri.conf.json — the
# updater compares against that, not against the tag.
name: Release

on:
  push:
    tags: ["v*"]
  # Useful for proving the matrix still builds without cutting a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon and Intel are separate bundles; a universal binary
          # would double every download for the sake of one artifact.
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          # Pinned deliberately: the AppImage links against whatever glibc the
          # runner has, so building on the newest Ubuntu would refuse to start
          # on anything older.
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            file \
            wget

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ matrix.target }}

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts. Without these the build still produces
          # installers, but `latest.json` gets no signature and every client
          # rejects the update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          # Only set on a tag push. `github.ref_name` on a manual run is the
          # branch, so passing it unconditionally would make the "prove the
          # matrix builds" button cut a draft release tagged `master`. Empty
          # means tauri-action builds and publishes nothing, which is the point.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Garmin Companion ${{ github.ref_name }}
          releaseBody: |
            Download the file for your platform below.

            **macOS** — `.dmg`, `aarch64` for Apple Silicon or `x64` for Intel.
            Drag the app to Applications, then run this once. The app is
            unsigned, and without it macOS refuses to open it at all — the
            right-click → Open trick is not enough on recent versions.

            ```sh
            xattr -dr com.apple.quarantine "/Applications/Garmin Companion.app"
            ```

            **Windows** — `-setup.exe`. SmartScreen calls it an unrecognised
            app: **More info** → **Run anyway**.

            **Linux** — `.AppImage` (`chmod +x` it, then run) or `.deb` /
            `.rpm`. Needs `webkit2gtk-4.1` from your package manager.

            Nothing here is signed with an OS vendor certificate, which is what
            both warnings are about. Updates are signed, and those work either
            way — existing installs update themselves from Settings.
          # Left as a draft so the release can be checked, and so the four
          # matrix jobs can finish filling it in before anyone downloads.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }}

      # A manual run publishes nothing, so the bundles would die with the
      # runner. Downloading them from here is how you check the app actually
      # starts on a platform you don't own, before committing to a tag.
      - name: Upload bundles for inspection
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error
