# Build a signed Android App Bundle (AAB) and upload it to Google Play.
#
# The setup steps copy the "android" job of release-rewrite.yml. A change to
# that job must also go here.
#
# The release run (release-rewrite.yml) calls this workflow and uploads to the
# alpha track. Run it by hand only for a new upload of a published release, or
# for another track: Actions -> Play -> Run workflow. It builds the tag.
name: Play

on:
  workflow_call:
    inputs:
      version:
        description: "Version as major.minor.patch."
        type: string
        required: true
      ref:
        description: "Commit to build. Empty means the tag v<version>."
        type: string
        default: ""
      track:
        type: string
        default: alpha
      status:
        type: string
        default: draft
  workflow_dispatch:
    inputs:
      version:
        description: "Version as major.minor.patch. Use the version of the release."
        required: true
      track:
        description: "Play track. alpha is the default closed testing track."
        type: choice
        options: [alpha, internal, beta, production]
        default: alpha
      status:
        # Play accepts only draft releases until the app is first published.
        description: "Release status."
        type: choice
        options: [draft, completed]
        default: draft

permissions:
  contents: read

jobs:
  # The same job id as in release-rewrite.yml, so the two jobs share the Rust cache.
  android:
    runs-on: ubuntu-24.04
    env:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # app.config.js turns this into the version name and the version code.
      APP_VERSION: ${{ inputs.version }}
      # Play does not allow an app to install its own updates. This value turns
      # off the config plugin that adds REQUEST_INSTALL_PACKAGES (prebuild) and
      # the update code in the JavaScript bundle.
      EXPO_PUBLIC_SELF_UPDATE: "0"
    steps:
      # A manual run builds the published tag. The release run gives the commit,
      # because the tag appears only when the user publishes the draft.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || format('v{0}', inputs.version) }}

      - name: Check the version
        run: |
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version"; exit 1; }

      - name: Check the signing key
        run: |
          [[ -n "$ANDROID_KEYSTORE" ]] || { echo "ANDROID_KEYSTORE is not set. A debug key would break updates."; exit 1; }

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - name: Install the NDK
        run: |
          sdkmanager --install "ndk;28.2.13676358"
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          # The NDK has only llvm-ranlib. The vendored OpenSSL needs RANLIB.
          LLVM_BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for target in aarch64_linux_android armv7_linux_androideabi; do
            echo "RANLIB_$target=$LLVM_BIN/llvm-ranlib" >> "$GITHUB_ENV"
          done

      - run: sudo apt-get update && sudo apt-get install -y perl make

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - uses: swatinem/rust-cache@v2
        with:
          key: rewrite-android

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml

      - name: Install JavaScript dependencies
        working-directory: apps/mobile
        run: pnpm install --frozen-lockfile

      - name: Build the Rust bridge
        working-directory: apps/mobile
        # The same two ABIs as the old APK. No x86_64: that is an emulator ABI.
        run: pnpm bridge:android --targets arm64-v8a,armeabi-v7a

      - name: Make the Android project
        working-directory: apps/mobile
        run: pnpm prebuild:android

      # The Expo template signs a release build with the debug key. The injected
      # signing properties replace that key. This is the upload key. Play App
      # Signing uses the same key.
      - name: Build the bundle
        working-directory: apps/mobile/android
        run: |
          echo "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          ./gradlew bundleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Check the bundle
        run: |
          AAB="apps/mobile/android/app/build/outputs/bundle/release/app-release.aab"
          # Play refuses a bundle that has the debug signature.
          keytool -printcert -jarfile "$AAB" | grep -q "CN=Omar Zunic" \
            || { echo "The bundle is not signed with the upload key."; exit 1; }
          # Play does not allow this permission. The manifest is protobuf, but
          # the permission name is plain text in the file.
          # Read the manifest into a file first. An unzip error must not look like "no match".
          unzip -p "$AAB" base/manifest/AndroidManifest.xml > manifest.pb
          [[ -s manifest.pb ]] || { echo "The bundle has no manifest."; exit 1; }
          if grep -aq REQUEST_INSTALL_PACKAGES manifest.pb; then
            echo "The bundle has REQUEST_INSTALL_PACKAGES."; exit 1
          fi
          mkdir -p play-out
          cp "$AAB" "play-out/garmin-companion_${APP_VERSION}.aab"

      # Upload the file first. A failed Play upload then still leaves the bundle.
      - uses: actions/upload-artifact@v7
        with:
          name: play
          path: play-out/
          if-no-files-found: error

      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.omznc.garmincompanion
          releaseFiles: play-out/garmin-companion_${{ inputs.version }}.aab
          tracks: ${{ inputs.track }}
          status: ${{ inputs.status }}
          releaseName: ${{ inputs.version }}
