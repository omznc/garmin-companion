# The gate before a tag. Deliberately Linux-only: this checks that the code is
# correct, and the release workflow is what proves it builds everywhere.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      # `tsc` runs as part of the build script, so this covers both.
      - name: Build frontend
        working-directory: app
        run: pnpm build

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The chat integration test is #[ignore]d: it spends real API credit and
      # needs a key out of the OS keyring, neither of which belongs in CI.
      - name: Test
        run: cargo test --workspace

  # Its own job rather than a step in `check`: the worker shares no toolchain
  # with the rest of this, and a Rust compile failure shouldn't hide a broken
  # proxy or the other way round. Deploying stays manual — the thing this is in
  # front of is a funded API key.
  worker:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml

      - name: Install worker dependencies
        working-directory: worker
        run: pnpm install --frozen-lockfile

      - name: Typecheck worker
        working-directory: worker
        run: pnpm typecheck

      - name: Test worker
        working-directory: worker
        run: pnpm test
