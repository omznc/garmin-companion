# The gate before a tag. Deliberately Linux-only: this checks that the code is
# correct, and the release workflow is what proves it builds everywhere.
name: CI

on:
  push:
    branches: [main, master, rewrite]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          # The last five are for the gpui desktop app (apps/desktop).
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libssl-dev \
            libxkbcommon-x11-dev libwayland-dev libfontconfig-dev libfreetype6-dev libxcb1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      # Every crate that links garmin-core must enable test-sandbox in its
      # dev-dependencies, and no normal dependency may enable it.
      - name: Test sandbox
        run: |
          cargo metadata --no-deps --format-version 1 | jq -e '
            [.packages[] | select(.name != "garmin-core")
             | . as $p | .dependencies | map(select(.name == "garmin-core"))
             | select(length > 0)
             | select(
                 any(.[]; .kind == null and (.features | index("test-sandbox")))
                 or (any(.[]; .kind == "dev" and (.features | index("test-sandbox"))) | not))
             | $p.name] == []'

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The chat integration test is #[ignore]d: it spends real API credit and
      # needs a key out of the OS keyring, neither of which belongs in CI.
      - name: Test
        run: cargo test --workspace

      # The mobile app reads its TypeScript types from the Rust wire types. A
      # change to a wire type must come with the new files. `git add -N` makes
      # a new file show in the diff, and the script removes the stale ones.
      - name: Check the generated TypeScript types
        run: |
          scripts/gen-types.sh
          git add --intent-to-add apps/mobile/src/data/generated
          git diff --exit-code -- apps/mobile/src/data/generated

  # The Linux packaging metadata, which is the one thing here that can be wrong
  # without anything failing. A stale <release> entry or a malformed
  # <screenshot> builds, installs and runs; it just means every software centre
  # on Linux advertises the previous version, or shows no pictures, and nobody
  # finds out for months.
  #
  # Its own job on 24.04 rather than a step in `check`, which is pinned to
  # 22.04. That runner ships appstreamcli 0.15, which predates the `<developer>`
  # element this file uses — it would fail the metadata for being newer than the
  # validator, which is the least useful failure available.
  metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - run: sudo apt-get update && sudo apt-get install -y appstream

      - name: Check the AppStream metadata
        run: |
          node scripts/check-metainfo.mjs
          # --no-net: the screenshot URLs point at raw.githubusercontent.com,
          # and fetching eight PNGs to prove a schema is fine is not this job's
          # business. A broken link surfaces in the software centre, not here.
          appstreamcli validate --no-net --explain \
            apps/desktop/linux/com.omznc.garmincompanion.metainfo.xml

  # Its own job rather than a step in `check`: the worker shares no toolchain
  # with the rest of this, and a Rust compile failure shouldn't hide a broken
  # proxy or the other way round. Deploying stays manual — the thing this is in
  # front of is a funded API key.
  worker:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: worker/pnpm-lock.yaml

      - name: Install worker dependencies
        working-directory: worker
        run: pnpm install --frozen-lockfile

      - name: Typecheck worker
        working-directory: worker
        run: pnpm typecheck

      - name: Test worker
        working-directory: worker
        run: pnpm test

  # The Expo app and the release scripts. The typecheck needs no Rust build:
  # src/data/garmin-bridge.d.ts declares the generated bridge module.
  mobile:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: pnpm install --frozen-lockfile

      - name: Test mobile
        working-directory: apps/mobile
        run: pnpm test

      - name: Check the format
        working-directory: apps/mobile
        run: pnpm format:check

      - name: Typecheck mobile
        working-directory: apps/mobile
        run: pnpm typecheck

      # The App Store refuses a build that uses a required-reason API with no
      # declared reason.
      - name: Check the iOS privacy manifest
        run: node scripts/check-privacy-manifest.mjs

      - name: Test the release scripts
        run: node --test scripts/release-rewrite.test.mjs
