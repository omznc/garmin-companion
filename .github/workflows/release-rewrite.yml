# The bridge release: the first release of the rewrite (gpui desktop app and
# Expo mobile app).
#
# Installed v0.9.1 apps are Tauri apps. They update through the files that this
# workflow makes, so the files must look like the files of the old Tauri release:
#   - Desktop: latest.json (Tauri v2 format), signed with the same minisign key,
#     with the same installer formats and the same bundle id.
#   - Android: latest-android.json, and an APK with the same application id,
#     the same signing key and a higher version code.
#
# The workflow makes a DRAFT release only. It never makes a tag and it never
# publishes. Publish by hand after you check the draft. Until you publish, the
# live latest.json does not change and no user gets the new app.
#
# desktop_only replaces the desktop files of a published release in place. It
# keeps the mobile files, makes latest.json again and moves the tag to this
# commit. An installed app of the same version does not update, because the
# version did not change.
#
# Run it by hand: Actions -> Release (rewrite) -> Run workflow.
name: Release (rewrite)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version as major.minor.patch. It must be higher than 0.9.1."
        required: true
        default: "1.0.0"
      notes:
        description: "Release notes. The old app shows them in Settings."
        required: false
        default: "First release of the rewritten app."
      desktop_only:
        description: "Rebuild only the desktop files of the published release of this version."
        type: boolean
        default: false

permissions:
  contents: write

env:
  # The CLI that makes the same bundles as the old Tauri build.
  TAURI_CLI: "2.12.3"

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
          DESKTOP_ONLY: ${{ inputs.desktop_only }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The updater and the APK check install only a version that is
          # newer than the installed one. 0.9.1 is the last Tauri release.
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version"; exit 1; }
          [[ "$(printf '%s\n0.9.1\n' "$VERSION" | sort -V | tail -n 1)" == "$VERSION" && "$VERSION" != "0.9.1" ]] \
            || { echo "version must be higher than 0.9.1"; exit 1; }
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            [[ "$DESKTOP_ONLY" == "true" ]] || { echo "release v$VERSION exists"; exit 1; }
          else
            [[ "$DESKTOP_ONLY" != "true" ]] || { echo "release v$VERSION does not exist"; exit 1; }
          fi
      - name: Check the AppStream release entry
        run: node scripts/check-metainfo.mjs "$VERSION"
        env:
          VERSION: ${{ inputs.version }}
      - name: Test the manifest script
        run: node --test scripts/release-rewrite.test.mjs

  desktop:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          # Pinned on purpose. The AppImage links against the glibc of the runner.
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # The first line is for the gpui app (the list of ci.yml).
          # The second line is for the sign-in helper (wry needs WebKitGTK).
          # The third line is for the AppImage tools.
          sudo apt-get install -y \
            libxkbcommon-x11-dev libwayland-dev libfontconfig-dev libfreetype6-dev libxcb1-dev libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            patchelf file wget squashfs-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          key: rewrite-${{ matrix.target }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build the app and the sign-in helper
        env:
          # Settings shows this version (garmin-api, settings::APP_VERSION). The
          # self-updater compares it with latest.json. A build without it checks nothing.
          APP_VERSION: ${{ inputs.version }}
        run: cargo build --release -p garmin-companion-desktop -p garmin-companion-login --target ${{ matrix.target }}

      # tauri.conf.json lists the helper as externalBin. The bundler looks for
      # garmin-companion-login-<triple> next to the config, and it puts the file
      # next to garmin-companion in every bundle.
      - name: Stage the sign-in helper
        run: |
          EXT=""
          [[ "${{ matrix.target }}" == *windows* ]] && EXT=".exe"
          cp "target/${{ matrix.target }}/release/garmin-companion-login${EXT}" \
            "apps/desktop/garmin-companion-login-${{ matrix.target }}${EXT}"

      # The bundler needs the binary at target/<triple>/release/garmin-companion.
      # --no-binary-patching: the new app does not use the Tauri updater, so
      # it needs no bundle type marker. The old app has its own marker.
      - name: Make the installers and sign them
        working-directory: apps/desktop
        env:
          # The same secrets as the old Tauri release. They sign the updater files.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VERSION: ${{ inputs.version }}
        run: |
          # Windows: NSIS only, as in the old Tauri release. WiX (MSI) refuses the
          # "ć" of the publisher, because it is not in code page 1252.
          BUNDLES=()
          [[ "${{ matrix.target }}" == *windows* ]] && BUNDLES=(--bundles nsis)
          npx --yes @tauri-apps/cli@${TAURI_CLI} bundle \
            --target "${{ matrix.target }}" "${BUNDLES[@]}" \
            --config "{\"version\":\"${VERSION}\"}" \
            --no-binary-patching --ci

      - name: Rename the files
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node scripts/release-rewrite.mjs collect \
            "target/${{ matrix.target }}/release/bundle" "${{ matrix.target }}" "$VERSION" out

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: out/
          if-no-files-found: error

  android:
    needs: check
    if: ${{ !inputs.desktop_only }}
    runs-on: ubuntu-24.04
    env:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # app.config.js turns this into the version name and the version code.
      APP_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the signing key
        run: |
          [[ -n "$ANDROID_KEYSTORE" ]] || { echo "ANDROID_KEYSTORE is not set. A debug key would break updates."; exit 1; }

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v4

      - name: Install the NDK
        run: |
          sdkmanager --install "ndk;28.2.13676358"
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK" >> "$GITHUB_ENV"
          # The NDK has only llvm-ranlib. The vendored OpenSSL needs RANLIB.
          LLVM_BIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for target in aarch64_linux_android armv7_linux_androideabi; do
            echo "RANLIB_$target=$LLVM_BIN/llvm-ranlib" >> "$GITHUB_ENV"
          done

      - run: sudo apt-get update && sudo apt-get install -y perl make

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - uses: swatinem/rust-cache@v2
        with:
          key: rewrite-android

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml

      - name: Install JavaScript dependencies
        working-directory: apps/mobile
        run: pnpm install --frozen-lockfile

      - name: Build the Rust bridge
        working-directory: apps/mobile
        # The same two ABIs as the old APK. No x86_64: that is an emulator ABI.
        run: pnpm bridge:android --targets arm64-v8a,armeabi-v7a

      - name: Make the Android project
        working-directory: apps/mobile
        run: pnpm prebuild:android

      - name: Build the APK
        working-directory: apps/mobile/android
        # The -P value replaces buildArchs of app.json (that list has x86_64 for dev).
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Check the R8 keep rules
        run: sh scripts/check-r8-keeps.sh apps/mobile/android/app/build/outputs/mapping/release/seeds.txt

      # The Expo template signs a release build with the debug key. Sign it
      # again with the key of the old app. The apksigner command replaces the
      # old signature.
      - name: Sign the APK
        run: |
          echo "$ANDROID_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          mkdir -p android-out
          APK="android-out/garmin-companion_${APP_VERSION}.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$APK" apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          rm -f "$RUNNER_TEMP/release.jks"
          "$BT/apksigner" verify --print-certs "$APK"
          "$BT/aapt2" dump badging "$APK" > badging.txt
          head -n 1 badging.txt
          # The same application id as the old app, or Android installs a second app.
          grep -q "^package: name='com.omznc.garmincompanion'" badging.txt
          # The version code follows the formula of the old Tauri app. A lower
          # code than the installed one makes Android refuse the update.
          IFS=. read -r MAJOR MINOR PATCH <<< "$APP_VERSION"
          CODE=$((10#$MAJOR * 1000000 + 10#$MINOR * 1000 + 10#$PATCH))
          grep -q "versionCode='$CODE'" badging.txt || { echo "versionCode is not $CODE"; exit 1; }
          grep -q "versionName='$APP_VERSION'" badging.txt || { echo "versionName is not $APP_VERSION"; exit 1; }
          # This APK updates itself, so it needs the permission. (The Play build leaves it out.)
          grep -q "uses-permission: name='android.permission.REQUEST_INSTALL_PACKAGES'" badging.txt \
            || { echo "REQUEST_INSTALL_PACKAGES is missing"; exit 1; }
          # The old app: minSdk 24, arm64-v8a and armeabi-v7a.
          # Newer aapt2 writes minSdkVersion, older aapt2 writes sdkVersion.
          grep -Eq "^(min)?[sS]dkVersion:'24'" badging.txt
          grep -q "native-code: 'arm64-v8a' 'armeabi-v7a'" badging.txt || grep -q "native-code: 'armeabi-v7a' 'arm64-v8a'" badging.txt

      # The same file that the old Tauri release wrote. The old app reads it to find a new APK.
      - name: Write latest-android.json
        run: |
          APK="android-out/garmin-companion_${APP_VERSION}.apk"
          cat > android-out/latest-android.json <<EOF
          {
            "version": "${APP_VERSION}",
            "url": "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/garmin-companion_${APP_VERSION}.apk",
            "sha256": "$(sha256sum "$APK" | cut -d' ' -f1)"
          }
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: android-out/
          if-no-files-found: error

  # Upload the Play bundle to the alpha track in the same run. The tag does not
  # exist yet, so the job builds the commit of this run. The draft job does not
  # need this job: a failed Play upload must not stop the draft release. The
  # upload can run again with the Play workflow.
  play:
    needs: check
    if: ${{ !inputs.desktop_only }}
    permissions:
      contents: read
    uses: ./.github/workflows/play.yml
    with:
      version: ${{ inputs.version }}
      ref: ${{ github.sha }}
      track: alpha
      status: completed
    secrets: inherit

  # An unsigned device IPA for testers who sign it themselves (Sideloadly,
  # AltStore). It is not in latest.json, and no updater reads it.
  ios:
    needs: check
    if: ${{ !inputs.desktop_only }}
    runs-on: macos-latest
    # This job runs third-party install scripts. It needs no write access.
    permissions:
      contents: read
    env:
      APP_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          key: rewrite-ios

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml

      - name: Install JavaScript dependencies
        working-directory: apps/mobile
        run: pnpm install --frozen-lockfile

      - name: Build the Rust bridge
        working-directory: apps/mobile
        # The device slice only. The simulator slices are not in the IPA.
        # The C code (sqlite, zstd) must target the iOS version of the app.
        # Without this value cc-rs uses the SDK version, and a newer Xcode breaks the link.
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "16.4"
        run: pnpm bridge:ios --targets aarch64-apple-ios

      - name: Make the iOS project
        working-directory: apps/mobile
        run: |
          rm -rf ios
          npx expo prebuild -p ios --no-install
          cd ios && pod install

      - name: Check the privacy manifest
        run: |
          manifest="$(find apps/mobile/ios -name PrivacyInfo.xcprivacy -not -path '*/Pods/*' | head -n 1)"
          [[ -n "$manifest" ]] || { echo "Prebuild made no PrivacyInfo.xcprivacy."; exit 1; }
          node scripts/check-privacy-manifest.mjs "$manifest"

      - name: Build the app without a signature
        working-directory: apps/mobile
        run: |
          WORKSPACE="$(ls -d ios/*.xcworkspace)"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/derived" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Make the IPA and check it
        run: |
          APP="$(ls -d "$RUNNER_TEMP"/derived/Build/Products/Release-iphoneos/*.app)"
          mkdir -p ios-out "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          IPA="$PWD/ios-out/garmin-companion_${APP_VERSION}_unsigned.ipa"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$IPA" Payload)
          ls -la ios-out
          BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          lipo -info "$BIN" | tee lipo.txt
          grep -q arm64 lipo.txt || { echo "no arm64 slice"; exit 1; }
          GOT="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")"
          [[ "$GOT" == "$APP_VERSION" ]] || { echo "version is $GOT, not $APP_VERSION"; exit 1; }
          [[ -f "$APP/main.jsbundle" ]] || { echo "main.jsbundle is missing"; exit 1; }
          unzip -l "$IPA" | grep -q "Payload/.*\.app/main.jsbundle"

      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: ios-out/
          if-no-files-found: error

  draft:
    needs: [desktop, android, ios]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: parts

      - name: Make latest.json
        env:
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          mkdir release
          cp parts/*/* release/
          printf '%s\n' "$NOTES" > notes.md
          node scripts/release-rewrite.mjs manifest "$VERSION" "$GITHUB_REPOSITORY" notes.md release release/latest.json
          sh scripts/latest-names.sh release "$VERSION"
          cat release/latest.json
          ls -la release

      # --draft: no tag, no public page. The live latest.json stays as it is.
      - name: Make the draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v$VERSION" --draft --target "$GITHUB_SHA" \
            --title "Garmin Companion v$VERSION" --notes-file notes.md release/*

  # The mobile files stay as they are. Only the desktop files and latest.json change.
  replace:
    needs: desktop
    if: ${{ inputs.desktop_only }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: parts

      - name: Swap the desktop files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release download "v$VERSION" --dir release
          cp parts/desktop-*/* release/
          gh release view "v$VERSION" --json body -q .body > notes.md
          node scripts/release-rewrite.mjs manifest "$VERSION" "$GITHUB_REPOSITORY" notes.md release release/latest.json
          cat release/latest.json
          ls -la release

      - name: Upload the files and move the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          # The desktop files, latest.json and the copies without the version.
          # The mobile files are already there.
          gh release upload "v$VERSION" --clobber release/latest.json \
            $(ls parts/desktop-*/* | xargs -n1 basename | sed 's|^|release/|') \
            $(sh scripts/latest-names.sh release "$VERSION")
          git push --force origin "$GITHUB_SHA:refs/tags/v$VERSION"
