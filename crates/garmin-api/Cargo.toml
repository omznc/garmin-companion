[package]
name = "garmin-api"
version = "0.1.0"
edition = "2021"
description = "Typed command API over the local Garmin cache, shared by the desktop and mobile apps"

[[bin]]
name = "garmin-api-fixture"
path = "src/bin/garmin-api-fixture.rs"

[dependencies]
garmin-core = { workspace = true }

anyhow = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
